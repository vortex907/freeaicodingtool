# Builds the Windows setup and publishes it as a GitHub release. FreeCode's built-in updater
# downloads new versions from these releases (checking the setup against SHA256SUMS.txt).
# Release a version: bump "version" in package.json, then push a tag, e.g. git tag v1.2.0 && git push origin v1.2.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nsis g++-mingw-w64-x86-64 unzip zip
      - run: npm ci
      - run: npm test
      - name: Build the Windows setup
        run: node scripts/build-windows.mjs
      - name: Checksums
        working-directory: release
        run: sha256sum FreeCode-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v${VERSION}"; fi
          if [ "${TAG#v}" != "${VERSION}" ]; then echo "Tag ${TAG} does not match package.json version ${VERSION}"; exit 1; fi
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "FreeCode ${VERSION}" --generate-notes
          gh release upload "$TAG" release/FreeCode-Setup-*.exe release/FreeCode-*-win-x64.zip release/SHA256SUMS.txt --clobber
