# Builds the Windows setup and publishes it as a GitHub release. FreeCode's built-in updater
# downloads new versions from these releases (checking the setup against SHA256SUMS.txt).
#
# To release: bump "version" in package.json and push. If there is no release for that version
# yet, this builds and publishes v<version> (creating the tag). Pushing a v* tag works too.
name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nsis g++-mingw-w64-x86-64 unzip zip
      - run: npm ci
      - run: npm test
      - name: Build the Windows setup
        run: node scripts/build-windows.mjs
      - name: Checksums
        working-directory: release
        run: sha256sum FreeCode-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "FreeCode ${VERSION}" --generate-notes
          gh release upload "$TAG" release/FreeCode-Setup-*.exe release/FreeCode-*-win-x64.zip release/SHA256SUMS.txt --clobber
