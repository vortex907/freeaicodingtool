name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Debugger test with the real debugpy runs only where debugpy is installed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install debugpy
      - run: npm ci
      - run: npm test
